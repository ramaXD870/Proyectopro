<tbody>

  <!-- Recorremos los productos guardados en el carrito -->
  @for (p of productos; track p.id) {

    <tr>

      <!-- ID del producto -->
      <td>{{p.id}}</td>

      <!-- Nombre -->
      <td>{{p.nombre}}</td>

      <!-- Precio (subtotal: precio x cantidad) -->
      <td>${{subtotal(p).toFixed(2)}}</td>

      <!-- Cantidad -->
      <td>

        <div class="contador">

          <!-- Botón para disminuir -->
          <button (click)="restar(p)">▼</button>

          <!-- Cantidad actual -->
          <span>{{p.cantidad || 1}}</span>

          <!-- Botón para aumentar -->
          <button (click)="sumar(p)">▲</button>

          <!-- Eliminar producto -->
          <button
            class="eliminar"
            (click)="eliminarProducto(p.id)"
          >
            X
          </button>

        </div>

      </td>

    </tr>

  }

</tbody>

<!-- TOTAL GENERAL del carrito -->
@if (productos.length > 0) {
<tfoot>
  <tr class="fila-total">
    <td colspan="2"><strong>Total</strong></td>
    <td colspan="2"><strong>${{total().toFixed(2)}}</strong></td>
  </tr>
</tfoot>
}

<!-- ACCIONES del carrito -->
@if (productos.length > 0) {
<div class="acciones-carrito">

  <button
    class="btn-vaciar"
    (click)="vaciarCarrito()"
  >
    Vaciar carrito
  </button>

  <button
    class="btn-comprar-ya"
    (click)="comprarYa()"
  >
    Comprar ya
  </button>

</div>
}
