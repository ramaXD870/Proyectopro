<!-- CONTENEDOR PRINCIPAL -->
<div class="registro-container">

  <div class="registro-card">

    <h2>🎮 Registro Pokémon</h2>

    <p>
      Completa tus datos para unirte a la tienda Pokémon.
    </p>

    <!-- FORMULARIO -->
    <form>

      <div class="grupo">
        <label>Nombre de entrenador</label>
        <input
          type="text"
          placeholder="Ash Ketchum">
      </div>

      <div class="grupo">
        <label>Correo</label>
        <input
          type="email"
          placeholder="ash@gmail.com">
      </div>

      <div class="grupo">
        <label>Contraseña</label>
        <input
          type="password"
          placeholder="********">
      </div>

      <div class="grupo">
        <label>Pokémon favorito</label>
        <input
          type="text"
          placeholder="Pikachu">
      </div>

      <!-- BOTÓN -->
      <button type="submit">

        Registrarse

      </button>

    </form>

  </div>

</div>
