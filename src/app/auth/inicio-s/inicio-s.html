<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Inicio de Sesión</h2>
      <p>Accede a tu cuenta</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email -->
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" class="form-control" placeholder="tu@email.com"
          [class.is-invalid]="email.invalid && email.touched">
        <div *ngIf="email.invalid && email.touched" class="invalid-feedback">
          <span *ngIf="email.errors?.['required']">El email es requerido</span>
          <span *ngIf="email.errors?.['email']">Email inválido</span>
        </div>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" class="form-control" placeholder="••••••••"
          [class.is-invalid]="password.invalid && password.touched">
        <div *ngIf="password.invalid && password.touched" class="invalid-feedback">
          <span *ngIf="password.errors?.['required']">La contraseña es requerida</span>
          <span *ngIf="password.errors?.['minlength']">Mínimo 6 caracteres</span>
        </div>
      </div>

      <!-- Recordar usuario y olvidar contraseña -->
      <div class="form-check-group">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="remember" formControlName="remember">
          <label class="form-check-label" for="remember">Recordar usuario</label>
        </div>
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Botones -->
      <div class="button-group">
        <button type="submit" class="btn btn-primary btn-login" [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="!isLoading">Iniciar Sesión</span>
          <span *ngIf="isLoading">Cargando...</span>
        </button>
      </div>

      <!-- Registro -->
      <div class="register-link">
        <p>¿No tienes cuenta? <a href="#" (click)="goToRegister($event)">Regístrate aquí</a></p>
      </div>
    </form>
  </div>
</div>
