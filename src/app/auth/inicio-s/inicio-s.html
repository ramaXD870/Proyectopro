<div class="login-container">

  <div class="login-card">

    <h2>⚡ Entrenador Pokémon</h2>

    <p>
      Inicia sesión para acceder a tu colección.
    </p>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()">

      <!-- EMAIL -->
      <div class="grupo">

        <label>Correo</label>

        <input
          type="email"
          formControlName="email">

      </div>

      <!-- PASSWORD -->
      <div class="grupo">

        <label>Contraseña</label>

        <input
          type="password"
          formControlName="password">

      </div>

      <!-- RECORDAR -->
      <div class="check">

        <input
          type="checkbox"
          formControlName="remember">

        <label>Recordarme</label>

      </div>

      <!-- BOTON -->
      <button
        type="submit">

        Iniciar Sesión

      </button>

      <!-- LINK REGISTRO -->
      <div class="registro">

        <a
          routerLink="/registro">

          Crear cuenta

        </a>

      </div>

    </form>

  </div>

</div>
