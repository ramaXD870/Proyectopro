<!-- ========================= -->
<!-- SECCIÓN DE OFERTAS -->
<!-- ========================= -->

<div class="contenedor-ofertas">

  <!-- TÍTULO DE LA PÁGINA -->
  <h1>🔥 Ofertas Pokémon</h1>

  <p class="subtitulo">
    Aprovecha estas ofertas especiales en cartas Pokémon.
  </p>

  <!-- CONTENEDOR DE TARJETAS -->
  <div class="cartas">

    <!-- CARTA 1 -->
    <div class="carta">

      <img
        src="assets/vx.webp"
        alt="Charizard">

      <h3>Charizard VMAX</h3>

      <p>Pokémon GO</p>

      <p class="precio-anterior">
        $250
      </p>

      <p class="precio">
        $189
      </p>

      <button
        (click)="agregarAlCarrito({
          id: 101,
          nombre: 'Charizard VMAX',
          categoria: 'Pokémon GO',
          imagen: 'assets/vx.webp',
          descripcion: 'Charizard VMAX en oferta',
          precio: 189,
          stock: 10,
          disponibilidad: true
        })">
        Agregar al carrito
      </button>

    </div>

    <!-- CARTA 2 -->
    <div class="carta">

      <img
        src="assets/union.webp"
        alt="Pikachu">

      <h3>Pikachu V-UNION</h3>

      <p>25 Aniversario</p>

      <p class="precio-anterior">
        $180
      </p>

      <p class="precio">
        $129
      </p>

      <button
        (click)="agregarAlCarrito({
          id: 102,
          nombre: 'Pikachu V-UNION',
          categoria: '25 Aniversario',
          imagen: 'assets/union.webp',
          descripcion: 'Pikachu V-UNION en oferta',
          precio: 129,
          stock: 10,
          disponibilidad: true
        })">
        Agregar al carrito
      </button>

    </div>

    <!-- CARTA 3 -->
    <div class="carta">

      <img
        src="assets/umbreom.webp"
        alt="Umbreon">

      <h3>Umbreon VMAX</h3>

      <p>Escarlata y Púrpura</p>

      <p class="precio-anterior">
        $320
      </p>

      <p class="precio">
        $249
      </p>

      <button
        (click)="agregarAlCarrito({
          id: 103,
          nombre: 'Umbreon VMAX',
          categoria: 'Escarlata y Púrpura',
          imagen: 'assets/umbreom.webp',
          descripcion: 'Umbreon VMAX en oferta',
          precio: 249,
          stock: 10,
          disponibilidad: true
        })">
        Agregar al carrito
      </button>

    </div>

  </div>

</div>
